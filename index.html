    <style>
        body { box-sizing: border-box; }
        .thai-font { font-family: 'Sarabun', 'Noto Sans Thai', sans-serif; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .error-type-btn {
            padding: 1rem 1.5rem; margin: 0.5rem; font-size: 1.1rem;
            font-weight: 600; border: none; border-radius: 0.75rem;
            cursor: pointer; transition: all 0.2s ease-in-out;
            width: 100%; color: white;
        }
        .error-type-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 12px rgba(0,0,0,0.15); }
        .swal2-input, .swal2-select {
            border: 1px solid #d1d5db !important; border-radius: 0.5rem !important;
            font-size: 1rem !important; height: auto !important;
            padding: 0.75rem 1rem !important;
        }
        .delete-button .trash-lid { transform-origin: top right; transition: transform 0.3s ease-in-out; }
        .delete-button:hover .trash-lid { transform: rotate(-45deg) translateY(-2px) translateX(1px); }
        
        /* --- IMPROVED SEARCHABLE DROPDOWN STYLES --- */
        .clinic-search-container { position: relative; width: 100%; }
        
        #clinic-search-input {
             padding: 0.75rem 1rem !important;
             border: 1px solid #d1d5db !important;
             border-radius: 0.5rem !important;
             box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
             width: 100%;
             transition: border-color 0.2s, box-shadow 0.2s;
        }
        #clinic-search-input:focus {
             outline: none;
             border-color: #3b82f6 !important;
             box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3) !important;
        }

        .clinic-dropdown {
            position: absolute; top: 100%; left: 0; right: 0; 
            z-index: 99999; 
            background: white; 
            border: 1px solid #e5e7eb;
            border-top: none;
            border-radius: 0 0 0.5rem 0.5rem;
            margin-top: 2px;
            max-height: 150px;
            overflow-y: auto;
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
        }
        .clinic-dropdown-item {
            padding: 0.8rem 1rem;
            cursor: pointer;
            transition: background-color 0.15s ease-in-out, color 0.15s ease-in-out;
            font-size: 1rem;
        }
        .clinic-dropdown-item:hover, .clinic-dropdown-item.highlighted { 
            background-color: #eef2ff;
            color: #4338ca;
            font-weight: 500;
        }
        .clinic-dropdown-empty {
             padding: 0.8rem 1rem;
             color: #6b7280;
             text-align: center;
        }

        /* --- SCANNER STYLES --- */
        #scanner-container {
            position: relative;
            overflow: hidden;
            border-radius: 0.5rem;
        }
        #scanner-container video, #scanner-container canvas {
            width: 100%;
            height: auto;
        }
        #scanner-container canvas.drawingBuffer {
            position: absolute;
            top: 0;
            left: 0;
        }
        .scanner-laser {
            position: absolute;
            left: 0;
            top: 50%;
            right: 0;
            height: 2px;
            background-color: red;
            box-shadow: 0 0 5px red;
            transform: translateY(-50%);
            z-index: 10;
        }

        /* --- NEW LOADER STYLES --- */
        .pl {
            width: 6em;
            height: 6em;
        }
        .pl__ring {
            animation: ringA 2s linear infinite;
        }
        .pl__ring--a { stroke: #f42f25; }
        .pl__ring--b { animation-name: ringB; stroke: #f49725; }
        .pl__ring--c { animation-name: ringC; stroke: #255ff4; }
        .pl__ring--d { animation-name: ringD; stroke: #f42582; }

        @keyframes ringA {
            from, 4% { stroke-dasharray: 0 660; stroke-width: 20; stroke-dashoffset: -330; }
            12% { stroke-dasharray: 60 600; stroke-width: 30; stroke-dashoffset: -335; }
            32% { stroke-dasharray: 60 600; stroke-width: 30; stroke-dashoffset: -595; }
            40%, 54% { stroke-dasharray: 0 660; stroke-width: 20; stroke-dashoffset: -660; }
            62% { stroke-dasharray: 60 600; stroke-width: 30; stroke-dashoffset: -665; }
            82% { stroke-dasharray: 60 600; stroke-width: 30; stroke-dashoffset: -925; }
            90%, to { stroke-dasharray: 0 660; stroke-width: 20; stroke-dashoffset: -990; }
        }
        @keyframes ringB {
            from, 12% { stroke-dasharray: 0 220; stroke-width: 20; stroke-dashoffset: -110; }
            20% { stroke-dasharray: 20 200; stroke-width: 30; stroke-dashoffset: -115; }
            40% { stroke-dasharray: 20 200; stroke-width: 30; stroke-dashoffset: -195; }
            48%, 62% { stroke-dasharray: 0 220; stroke-width: 20; stroke-dashoffset: -220; }
            70% { stroke-dasharray: 20 200; stroke-width: 30; stroke-dashoffset: -225; }
            90% { stroke-dasharray: 20 200; stroke-width: 30; stroke-dashoffset: -305; }
            98%, to { stroke-dasharray: 0 220; stroke-width: 20; stroke-dashoffset: -330; }
        }
        @keyframes ringC {
            from { stroke-dasharray: 0 440; stroke-width: 20; stroke-dashoffset: 0; }
            8% { stroke-dasharray: 40 400; stroke-width: 30; stroke-dashoffset: -5; }
            28% { stroke-dasharray: 40 400; stroke-width: 30; stroke-dashoffset: -175; }
            36%, 58% { stroke-dasharray: 0 440; stroke-width: 20; stroke-dashoffset: -220; }
            66% { stroke-dasharray: 40 400; stroke-width: 30; stroke-dashoffset: -225; }
            86% { stroke-dasharray: 40 400; stroke-width: 30; stroke-dashoffset: -395; }
            94%, to { stroke-dasharray: 0 440; stroke-width: 20; stroke-dashoffset: -440; }
        }
        @keyframes ringD {
            from, 8% { stroke-dasharray: 0 440; stroke-width: 20; stroke-dashoffset: 0; }
            16% { stroke-dasharray: 40 400; stroke-width: 30; stroke-dashoffset: -5; }
            36% { stroke-dasharray: 40 400; stroke-width: 30; stroke-dashoffset: -175; }
            44%, 50% { stroke-dasharray: 0 440; stroke-width: 20; stroke-dashoffset: -220; }
            58% { stroke-dasharray: 40 400; stroke-width: 30; stroke-dashoffset: -225; }
            78% { stroke-dasharray: 40 400; stroke-width: 30; stroke-dashoffset: -395; }
            86%, to { stroke-dasharray: 0 440; stroke-width: 20; stroke-dashoffset: -440; }
        }
        
        /* --- Export Excel Button Styles --- */
        .bookmarkBtn {
            width: 150px;
            height: 40px;
            border-radius: 40px;
            border: 1px solid #d1d5db; /* Light gray border */
            background-color: rgb(255, 255, 255); /* White background */
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition-duration: 0.3s;
            overflow: hidden;
        }
        .bookmarkBtn .IconContainer {
            width: 30px;
            height: 30px;
            background: linear-gradient(to bottom, rgb(110, 234, 131), rgb(45, 176, 70));
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 2;
            transition-duration: 0.3s;
        }
        .bookmarkBtn .icon {
            border-radius: 1px;
            fill: #fff; /* Icon color white */
        }
        .bookmarkBtn .text {
            height: 100%;
            width: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgb(12, 12, 12); /* Black text */
            z-index: 1;
            transition-duration: 0.3s;
            font-size: 1.04em;
            font-weight: 500;
        }
        .bookmarkBtn:hover .IconContainer {
            width: 140px;
            transition-duration: 0.3s;
        }
        .bookmarkBtn:hover .text {
            transform: translate(10px);
            width: 0;
            font-size: 0;
            transition-duration: 0.3s;
        }
        .bookmarkBtn:active {
            transform: scale(0.95);
            transition-duration: 0.3s;
        }

        /* --- Clear Filter Button Styles --- */
        .clearBtn {
            width: 150px; /* Adjusted width */
            height: 40px;
            border-radius: 40px;
            border: 1px solid #d1d5db;
            background-color: rgb(255, 255, 255);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition-duration: 0.3s;
            overflow: hidden;
        }
        .clearBtn .IconContainer {
            width: 30px;
            height: 30px;
            background: linear-gradient(to bottom, rgb(248, 113, 113), rgb(220, 38, 38)); /* Red tones */
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 2;
            transition-duration: 0.3s;
        }
        .clearBtn .icon {
            border-radius: 1px;
            fill: #fff;
        }
        .clearBtn .text {
            height: 100%;
            width: 110px; /* Adjusted width */
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgb(12, 12, 12);
            z-index: 1;
            transition-duration: 0.3s;
            font-size: 1.04em;
            font-weight: 500;
        }
        .clearBtn:hover .IconContainer {
            width: 140px; /* Adjusted width */
            transition-duration: 0.3s;
        }
        .clearBtn:hover .text {
            transform: translate(10px);
            width: 0;
            font-size: 0;
            transition-duration: 0.3s;
        }
        .clearBtn:active {
            transform: scale(0.95);
            transition-duration: 0.3s;
        }

        /* --- Add Clinic Button Styles --- */
        .addClinicBtn {
            width: 150px; /* Adjusted width */
            height: 40px;
            border-radius: 40px;
            border: 1px solid #d1d5db;
            background-color: rgb(255, 255, 255);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition-duration: 0.3s;
            overflow: hidden;
        }
        .addClinicBtn .IconContainer {
            width: 30px;
            height: 30px;
            background: linear-gradient(to bottom, rgb(110, 234, 131), rgb(45, 176, 70)); /* Green tones */
            border-radius: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 2;
            transition-duration: 0.3s;
        }
        .addClinicBtn .icon {
            border-radius: 1px;
            fill: #fff;
        }
        .addClinicBtn .text {
            height: 100%;
            width: 110px; /* Adjusted width */
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgb(12, 12, 12);
            z-index: 1;
            transition-duration: 0.3s;
            font-size: 1.04em;

        }
        .addClinicBtn:hover .IconContainer {
            width: 140px; /* Adjusted width */
            transition-duration: 0.3s;
        }
        .addClinicBtn:hover .text {
            transform: translate(10px);
            width: 0;
            font-size: 0;
            transition-duration: 0.3s;
        }
        .addClinicBtn:active {
            transform: scale(0.95);
            transition-duration: 0.3s;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-full thai-font">
    
    <div id="loadingOverlay" class="fixed inset-0 bg-white bg-opacity-90 flex items-center justify-center z-50" style="display: none;">
        <div class="text-center">
             <svg class="pl mx-auto" width="120" height="120" viewBox="0 0 240 240">
                <circle class="pl__ring pl__ring--a" cx="120" cy="120" r="105" fill="none" stroke="#000" stroke-width="20" stroke-dasharray="0 660" stroke-dashoffset="-330" stroke-linecap="round"></circle>
                <circle class="pl__ring pl__ring--b" cx="120" cy="120" r="35" fill="none" stroke="#000" stroke-width="20" stroke-dasharray="0 220" stroke-dashoffset="-110" stroke-linecap="round"></circle>
                <circle class="pl__ring pl__ring--c" cx="85" cy="120" r="70" fill="none" stroke="#000" stroke-width="20" stroke-dasharray="0 440" stroke-linecap="round"></circle>
                <circle class="pl__ring pl__ring--d" cx="155" cy="120" r="70" fill="none" stroke="#000" stroke-width="20" stroke-dasharray="0 440" stroke-linecap="round"></circle>
            </svg>
            <p class="mt-4 text-gray-700 font-semibold">กำลังโหลดข้อมูลล่าสุด...</p>
        </div>
    </div>

    <header class="bg-white shadow-lg border-b-4 border-blue-600">
        <div class="container mx-auto px-4 py-6 text-center">
            <h1 class="text-2xl md:text-3xl font-bold text-blue-800 mb-2">ระบบเก็บข้อมูล Prescribing Error</h1>
            <p class="text-blue-600 text-sm md:text-base">ห้องจ่ายยาผู้ป่วยนอก โรงพยาบาลอุตรดิตถ์</p>
        </div>
    </header>

    <nav class="bg-blue-600 shadow-md">
        <div class="container mx-auto px-4">
            <div class="flex justify-center space-x-1">
                <button onclick="showPage('record')" id="recordTab" class="px-6 py-3 text-white font-medium transition-all duration-200 border-b-2 border-transparent hover:bg-blue-700 focus:outline-none">📝 บันทึกข้อมูล</button>
                <button onclick="showPage('report')" id="reportTab" class="px-6 py-3 text-white font-medium transition-all duration-200 border-b-2 border-transparent hover:bg-blue-700 focus:outline-none">📊 รายงาน</button>
            </div>
        </div>
    </nav>

    <div id="recordPage" class="container mx-auto px-4 py-8 max-w-2xl"></div>
    <div id="reportPage" class="container mx-auto px-4 py-8 hidden"></div>

    <footer class="text-center py-4">
        <p id="syncStatus" class="text-xs text-gray-500">กำลังเชื่อมต่อ...</p>
    </footer>

    <script>
        // --- PWA Service Worker Registration (Optional) ---
        if ('serviceWorker' in navigator) { 
            window.addEventListener('load', () => { 
                navigator.serviceWorker.register('sw.js').catch(err => console.log('Service Worker registration failed: ', err)); 
            }); 
        }

        // --- Configuration ---
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwRXhaSc12Qb-SZGE7Lo1hkeRYbUDsRDkAHyqlfDjkLxkpL_eimtLOJOZC6Ky6osFHF/exec'; 
        
        // --- Global State ---
        let medErrorData = [];
        let clinics = ['อายุรกรรมทั่วไป', 'ศัลยกรรมกระดูก', 'ศัลยกรรมประสาท', 'สูติ-นรีเวช', 'โรคเลือด', 'ผิวหนัง', 'เบาหวาน', 'ความดัน']; // Default clinics
        const errorTypes = ['จำนวนยาไม่ถึงนัด', 'เกินวันนัด', 'สั่งยาวิธีใช้ off'];
        let chart = null, pieChart = null, clinicChart = null, timeSlotChart = null;
        let isSyncing = false;
        let recentRecordsPage = 0, dataTablePage = 0;
        let currentFilteredData = [];
        const RECENT_ITEMS_PER_PAGE = 10;
        const DATA_TABLE_ITEMS_PER_PAGE = 20;
        let highlightedIndex = -1; 

        // --- Chart.js Setup ---
        Chart.register(ChartDataLabels);

        // --- App Initialization ---
        document.addEventListener('DOMContentLoaded', async () => {
            medErrorData = JSON.parse(localStorage.getItem('medErrorData')) || [];
            const storedClinics = JSON.parse(localStorage.getItem('clinics')) || [];
            if (storedClinics.length > 0) {
                clinics = storedClinics;
            }
            // currentFilteredData = [...medErrorData]; // Removed for auto-filter
            showPage('record'); 
            await fetchDataFromSheet(); 
        });

        // --- Data Fetching ---
        async function fetchDataFromSheet() {
            if (isSyncing) return;
            isSyncing = true;
            showLoading(true);
            document.getElementById('syncStatus').textContent = 'กำลังซิงค์ข้อมูล...';
            try {
                const response = await fetch(scriptURL);
                if (!response.ok) throw new Error(`Network response error: ${response.statusText}`);
                const result = await response.json();
                
                if (result.status === 'success') {
                    const rawData = (result.data.pe || []);
                    medErrorData = rawData.map(record => {
                        const recordDate = new Date(record.timestamp);
                        return {
                            ...record,
                            date: formatDateToThaiString(recordDate),
                            time: formatTimeToThaiString(recordDate)
                        };
                    }).sort((a, b) => b.id - a.id); 

                    clinics = result.data.clinics || clinics;
                    localStorage.setItem('medErrorData', JSON.stringify(medErrorData));
                    localStorage.setItem('clinics', JSON.stringify(clinics));
                    updateUIAfterFetch();
                    document.getElementById('syncStatus').textContent = `อัปเดตล่าสุด: ${new Date().toLocaleTimeString('th-TH')}`;
                } else { 
                    throw new Error(result.message || 'Unknown server error'); 
                }
            } catch (error) {
                console.error('Fetch Error:', error);
                const errorMessage = error.toString();
                
                if (errorMessage.includes('getDataRange') || errorMessage.includes('getSheetByName') || errorMessage.includes('ไม่พบชีทชื่อ')) {
                    Swal.fire({
                        icon: 'error',
                        title: 'เกิดข้อผิดพลาดในการเชื่อมต่อชีท',
                        html: `ไม่สามารถดึงข้อมูลได้ อาจเกิดจากชีท <b>"Data"</b> หรือ <b>"Clinics"</b> ไม่มีอยู่ หรือสะกดชื่อผิด<br><br>กรุณาตรวจสอบ Google Sheet ของคุณและลองอีกครั้ง`,
                        confirmButtonText: 'รับทราบ'
                    });
                    document.getElementById('syncStatus').textContent = 'ตั้งค่าชีทไม่ถูกต้อง';
                } else {
                    showNotification('ไม่สามารถโหลดข้อมูลล่าสุดได้', 'error');
                    document.getElementById('syncStatus').textContent = 'การเชื่อมต่อล้มเหลว';
                }
            } finally { 
                isSyncing = false; 
                showLoading(false); 
            }
        }
        
        // --- Page Navigation ---
        function showPage(page) {
            document.getElementById('recordPage').style.display = 'none';
            document.getElementById('reportPage').style.display = 'none';
            
            if (page === 'record') { 
                renderRecordPage(); 
                document.getElementById('recordPage').style.display = 'block'; 
            } else { 
                renderReportPage(); 
                document.getElementById('reportPage').style.display = 'block'; 
                loadReportData(); 
            }
            
            const recordTab = document.getElementById('recordTab');
            const reportTab = document.getElementById('reportTab');
            if(recordTab) recordTab.classList.toggle('bg-blue-700', page === 'record');
            if(reportTab) reportTab.classList.toggle('bg-blue-700', page === 'report');
        }
        
        // --- UI Rendering ---
        function renderRecordPage() {
            document.getElementById('recordPage').innerHTML = `
                <div class="bg-white rounded-xl shadow-xl p-6 md:p-8 fade-in relative">
                    <button onclick="showAddClinicModal()" class="addClinicBtn absolute top-4 right-4">
                        <span class="IconContainer">
                            <svg xmlns="http://www.w3.org/2000/svg" height="1em" viewBox="0 0 448 512" class="icon">
                                <path d="M256 80c0-17.7-14.3-32-32-32s-32 14.3-32 32V224H48c-17.7 0-32 14.3-32 32s14.3 32 32 32H192V432c0 17.7 14.3 32 32 32s32-14.3 32-32V288H400c17.7 0 32-14.3 32-32s-14.3-32-32-32H256V80z"></path>
                            </svg>
                        </span>
                        <p class="text">Add Clinic</p>
                    </button>
                    <div class="text-center mb-8">
                        <div class="bg-blue-100 rounded-full w-16 h-16 flex items-center justify-center mx-auto mb-4"><span class="text-2xl">🏥</span></div>
                        <h2 class="text-xl md:text-2xl font-bold text-gray-800 mb-2">บันทึกข้อมูล Med Error</h2>
                    </div>
                    <form onsubmit="showErrorTypeModal(event)" class="space-y-6">
                        <div>
                            <label for="hnInput" class="block text-sm font-medium text-gray-700 mb-2">หมายเลข HN ผู้ป่วย</label>
                            <div class="flex items-center space-x-2">
                                <input type="text" id="hnInput" class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 text-lg text-center" placeholder="กรอกหรือสแกน HN" required>
                                <button type="button" onclick="startScanner()" class="p-3 bg-blue-100 hover:bg-blue-200 rounded-lg transition-colors" aria-label="สแกนบาร์โค้ด">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-blue-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                      <path stroke-linecap="round" stroke-linejoin="round" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                                      <path stroke-linecap="round" stroke-linejoin="round" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg transition-transform transform hover:scale-105">💾 บันทึกข้อมูล</button>
                    </form>
                    <div class="mt-8">
                        <div class="flex justify-between items-center mb-4">
                             <h3 class="text-lg font-semibold text-gray-800">📋 รายการล่าสุด</h3>
                             <div class="flex items-center space-x-2">

        // --- Barcode Scanner Logic ---
        const handleScannerProcessed = (result) => {
            const drawingCtx = Quagga.canvas.ctx.overlay;
            const drawingCanvas = Quagga.canvas.dom.overlay;
            if (!drawingCtx || !drawingCanvas) return;
            drawingCtx.clearRect(0, 0, parseInt(drawingCanvas.getAttribute("width")), parseInt(drawingCanvas.getAttribute("height")));
            if (result && result.boxes) {
                result.boxes.filter(box => box !== result.box).forEach(box => {
                    Quagga.ImageDebug.drawPath(box, {x: 0, y: 1}, drawingCtx, {color: "green", lineWidth: 2});
                });
            }
            if (result && result.box) Quagga.ImageDebug.drawPath(result.box, {x: 0, y: 1}, drawingCtx, {color: "#00F", lineWidth: 2});
            if (result && result.codeResult && result.codeResult.code) Quagga.ImageDebug.drawPath(result.line, {x: 'x', y: 'y'}, drawingCtx, {color: 'red', lineWidth: 3});
        };

        const handleScannerDetected = (result) => {
            const code = result.codeResult.code;
            Quagga.stop();
            Quagga.offProcessed(handleScannerProcessed);
            Quagga.offDetected(handleScannerDetected);

            Swal.fire({
                title: 'สแกนสำเร็จ', text: `หมายเลข HN ที่ได้คือ: ${code}`, icon: 'success',
                showCancelButton: true, confirmButtonText: 'ยืนยัน', cancelButtonText: 'สแกนใหม่'
            }).then((dialogResult) => {
                 if(dialogResult.isConfirmed) {
                    document.getElementById('hnInput').value = code;
                    Swal.close();
                    showNotification(`บันทึก HN: ${code}`, 'success');
                 } else if (dialogResult.dismiss === Swal.DismissReason.cancel) {
                    startScanner();
                 }
            });
        };

        function startScanner() {
            Swal.fire({
                title: 'สแกนบาร์โค้ด HN',
                html: `<div id="scanner-container"><div class="scanner-laser"></div></div><p class="mt-2 text-sm text-gray-600">จัดตำแหน่งบาร์โค้ดให้อยู่ในกรอบ</p>`,
                showConfirmButton: false, showCancelButton: true, cancelButtonText: 'ยกเลิก',
                didOpen: () => {
                    Quagga.init({
                        inputStream: {
                            name: "Live", type: "LiveStream", target: document.querySelector('#scanner-container'),
                            constraints: { width: 640, height: 480, facingMode: "environment" },
                        },
                        locator: { patchSize: "medium", halfSample: true },
                        numOfWorkers: navigator.hardwareConcurrency || 4,
                        decoder: { readers: ["code_128_reader", "code_39_reader"], multiple: false },
                        locate: true
                    }, (err) => {
                        if (err) {
                            console.error(err);
                            Swal.fire('เกิดข้อผิดพลาด', 'ไม่สามารถเริ่มต้นการทำงานของกล้องได้', 'error');
                            return;
                        }
                        Quagga.onProcessed(handleScannerProcessed);
                        Quagga.onDetected(handleScannerDetected);
                        Quagga.start();
                    });
                },
                willClose: () => {
                    Quagga.offProcessed(handleScannerProcessed);
                    Quagga.offDetected(handleScannerDetected);
                    Quagga.stop();
                }
            });
        }

        // --- DATE/TIME HELPER FUNCTIONS ---
        function formatDateToThaiString(date) {
            if (!(date instanceof Date) || isNaN(date)) return '';
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear() + 543;
            return `${day}/${month}/${year}`;
        }

        function formatTimeToThaiString(date) {
            if (!(date instanceof Date) || isNaN(date)) return '';
            const hours = String(date.getHours()).padStart(2, '0');
            const minutes = String(date.getMinutes()).padStart(2, '0');
            return `${hours}:${minutes}`;
        }

        function showClinicModal(hn, errorType) {
            highlightedIndex = -1; 
            const outsideClickListener = (e) => {
                const container = document.getElementById('searchable-dropdown-container');
                if (container && !container.contains(e.target)) {
                    const dropdown = document.getElementById('clinic-dropdown');
                    if (dropdown) dropdown.classList.add('hidden');

            };
            const keydownListener = (e) => handleDropdownKeys(e);

            Swal.fire({
                title: `เลือกคลินิกสำหรับ HN: ${hn}`,
                html: `
                    <p class="text-gray-500 mb-4">ประเภท: <strong>${errorType}</strong></p>
                    <div id="searchable-dropdown-container" class="text-left" style="margin-bottom: 10rem;">

                         <div class="clinic-search-container">
                            <input id="clinic-search-input" autocomplete="off" placeholder="พิมพ์เพื่อค้นหาคลินิก...">
                            <div id="clinic-dropdown" class="clinic-dropdown hidden"></div>
                        </div>
                    </div>`,
                showCancelButton: true, confirmButtonText: 'บันทึก', cancelButtonText: 'ย้อนกลับ',
                stopKeydownPropagation: false,
                didOpen: () => {
                    const popup = Swal.getPopup();
                    const container = Swal.getHtmlContainer();
                    if (popup) popup.style.overflow = 'visible';
                    if (container) container.style.overflow = 'visible';

                    const input = document.getElementById('clinic-search-input');
                    input.addEventListener('focus', filterClinics);
                    input.addEventListener('keyup', (e) => { 
                        if (e.key !== 'ArrowUp' && e.key !== 'ArrowDown' && e.key !== 'Enter') filterClinics();
                    });
                    input.addEventListener('keydown', keydownListener);
                    document.addEventListener('click', outsideClickListener);
                    filterClinics();
                    input.focus();
                },
                willClose: () => {
                    document.removeEventListener('click', outsideClickListener);
                    const input = document.getElementById('clinic-search-input');
                    if(input) input.removeEventListener('keydown', keydownListener);
                    const popup = Swal.getPopup();
                     if (popup) popup.style.overflow = 'auto';
                },
                preConfirm: () => {
                    const clinic = document.getElementById('clinic-search-input').value.trim();
                    if (!clinic) { Swal.showValidationMessage('กรุณาเลือกหรือกรอกชื่อคลินิก'); return false; }
                    return { hn, errorType, clinic };
                }
            }).then((result) => {
                if (result.isConfirmed) { 
                    saveError(result.value.hn, result.value.errorType, result.value.clinic); 
                } else if (result.dismiss === Swal.DismissReason.cancel) { 
                    showErrorTypeModal({ preventDefault: () => {} }); 
                }
            });
        }
        
        function handleDropdownKeys(e) {
            const dropdown = document.getElementById('clinic-dropdown');
            if (!dropdown || dropdown.classList.contains('hidden')) return;

            const items = dropdown.getElementsByClassName('clinic-dropdown-item');
            if (!items.length) return;

            if (e.key === 'ArrowDown') {
                e.preventDefault();
                highlightedIndex = (highlightedIndex + 1) % items.length;
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                highlightedIndex = (highlightedIndex - 1 + items.length) % items.length;
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (highlightedIndex > -1 && items[highlightedIndex]) {
                    items[highlightedIndex].click();
                } else {
                    Swal.clickConfirm();
                }
                return;
            }
            updateHighlight(items);
        }

        function updateHighlight(items) {
             for (let i = 0; i < items.length; i++) items[i].classList.remove('highlighted');
             if(items[highlightedIndex]) {
                items[highlightedIndex].classList.add('highlighted');
                items[highlightedIndex].scrollIntoView({ block: 'nearest' });
            }
        }

        // *** NEW FUNCTION: Show All Clinics Modal ***
        function showAllClinicsModal() {
            // 1. Get counts from currentFilteredData
            const clinicCounts = currentFilteredData.reduce((acc, { clinic }) => {
                if (clinic) {
                    acc[clinic] = (acc[clinic] || 0) + 1;
                }
                return acc;
            }, {});

            // 2. Sort by count, descending
            const sortedClinics = Object.entries(clinicCounts).sort(([, a], [, b]) => b - a);

            // 3. Generate HTML for the modal
            let modalHtml = '<div class="text-left max-h-80 overflow-y-auto px-4">';
            if (sortedClinics.length === 0) {
                modalHtml += '<p class="text-center text-gray-500">ไม่มีข้อมูล</p>';
            } else {
                modalHtml += '<ul class="divide-y divide-gray-200">';
                sortedClinics.forEach(([clinic, count], index) => {
                    modalHtml += `
                        <li class="py-3 flex justify-between items-center">
                            <span class="font-medium text-gray-700">${index + 1}. ${clinic}</span>
                            <span class="font-bold text-blue-600 bg-blue-100 px-3 py-1 rounded-full text-sm">${count}</span>
                        </li>
                    `;
                });
                modalHtml += '</ul>';
            }
            modalHtml += '</div>';

            // 4. Show SweetAlert
            Swal.fire({
                title: 'รายละเอียด Error ตามคลินิก',
                html: modalHtml,
                width: '500px',
                confirmButtonText: 'ปิด'
            });
        }

        function filterClinics() {
            const input = document.getElementById('clinic-search-input');
            const dropdown = document.getElementById('clinic-dropdown');
            if (!input || !dropdown) return;
            highlightedIndex = -1; 
            const filter = input.value.toLowerCase();
            const filteredClinics = clinics.filter(c => c.toLowerCase().includes(filter));
            dropdown.innerHTML = filteredClinics.length > 0
                ? filteredClinics.map(c => `<div class="clinic-dropdown-item" onclick="selectClinic('${c}')">${c}</div>`).join('')
                : `<div class="clinic-dropdown-empty">ไม่พบคลินิก</div>`;
            dropdown.classList.remove('hidden');
        }

        function selectClinic(clinicName) {
            document.getElementById('clinic-search-input').value = clinicName;
            document.getElementById('clinic-dropdown').classList.add('hidden');
            Swal.clickConfirm(); 
        }
        
        function saveError(hn, errorType, clinic) {
            const now = new Date();
            const record = { 
                id: now.getTime(), 
                hn, errorType, clinic, 
                timestamp: now.toISOString(), 
                date: formatDateToThaiString(now), 
                time: formatTimeToThaiString(now) 
            };
            medErrorData.unshift(record);
            recentRecordsPage = 0;
            updateUIAfterFetch();
            document.getElementById('hnInput').value = '';
            showNotification('บันทึกข้อมูลสำเร็จ', 'success');
            sendToGoogleSheets('addRecord', record).then(result => {
                if (!result || result.status !== 'success') {
                    console.error("Sync failed, rolling back.", result);
                    if (result && result.status === 'duplicate') { 
                        Swal.fire({ icon: 'warning', title: 'ข้อมูลซ้ำ', text: `พบข้อมูล Error นี้ของ HN: ${hn} ในวันนี้แล้ว` }); 
                    } else { 
                        showNotification('การบันทึกข้อมูลล้มเหลว', 'error'); 
                    }
                    medErrorData = medErrorData.filter(r => r.id !== record.id);
                    updateUIAfterFetch();
                }
            });
        }
        
        function editRecord(recordId) {
            const record = medErrorData.find(r => r.id === recordId);
            if (!record) return;
            const errorOptionsHtml = errorTypes.map(type => `<option value="${type}" ${record.errorType === type ? 'selected' : ''}>${type}</option>`).join('');
            const clinicOptionsHtml = clinics.map(c => `<option value="${c}" ${record.clinic === c ? 'selected' : ''}>${c}</option>`).join('');
            Swal.fire({
                title: 'แก้ไขข้อมูล',
                html: `<div class="space-y-4 p-2 text-center"><div><label class="block text-sm font-medium text-gray-700 mb-1">หมายเลข HN</label><input id="swal-hn-input" class="swal2-input w-full" value="${record.hn}"></div><div><label class="block text-sm font-medium text-gray-700 mb-1">ประเภท</label><select id="swal-error-type-select" class="swal2-select w-full">${errorOptionsHtml}</select></div><div><label class="block text-sm font-medium text-gray-700 mb-1">คลินิก</label><select id="swal-clinic-select" class="swal2-select w-full">${clinicOptionsHtml}</select></div></div>`,
                showCancelButton: true, confirmButtonText: 'บันทึก',
                preConfirm: () => {
                    const newHn = document.getElementById('swal-hn-input').value.trim();
                    if (!newHn) { Swal.showValidationMessage('กรุณากรอกหมายเลข HN'); return false; }
                    return { newHn, newErrorType: document.getElementById('swal-error-type-select').value, newClinic: document.getElementById('swal-clinic-select').value };
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    const { newHn, newErrorType, newClinic } = result.value;
                    const updatedRecord = { ...record, hn: newHn, errorType: newErrorType, clinic: newClinic };
                    medErrorData = medErrorData.map(r => r.id === recordId ? updatedRecord : r);
                    updateUIAfterFetch();
                    showNotification('กำลังแก้ไข...', 'info');
                    sendToGoogleSheets('editRecord', { id: recordId, hn: newHn, errorType: newErrorType, clinic: newClinic })
                        .then(res => { if (res && res.status === 'success') { showNotification('แก้ไขสำเร็จ', 'success'); fetchDataFromSheet(); } });
                }
            });
        }
        
        function deleteRecord(recordId) {
            Swal.fire({ title: 'ยืนยันการลบ', text: "ข้อมูลจะถูกลบอย่างถาวร!", icon: 'warning', showCancelButton: true, confirmButtonColor: '#d33', confirmButtonText: 'ใช่, ลบเลย!' }).then((result) => {
                if (result.isConfirmed) {
                    const originalData = [...medErrorData];
                    medErrorData = medErrorData.filter(r => r.id !== recordId);
                    updateUIAfterFetch();
                    showNotification('กำลังลบ...', 'info');
                    sendToGoogleSheets('deleteRecord', { id: recordId }).then(res => {
                        if (res && res.status === 'success') { 
                            showNotification('ลบสำเร็จ', 'success'); 
                            fetchDataFromSheet(); 
                        } else { 
                            medErrorData = originalData; 
                            updateUIAfterFetch(); 
                        }
                    });
                }
            });
        }

        // --- UI Updates & Pagination ---
        function updateUIAfterFetch() {
            updateRecentRecords();
            if (document.getElementById('reportPage').style.display === 'block') { 
                loadReportData(); 
            }
        }

        function prevRecentPage() { if (recentRecordsPage > 0) { recentRecordsPage--; updateRecentRecords(); } }
        function nextRecentPage() { const totalPages = Math.ceil(medErrorData.length / RECENT_ITEMS_PER_PAGE); if (recentRecordsPage < totalPages - 1) { recentRecordsPage++; updateRecentRecords(); } }
        
        function updateRecentRecords() {
            const container = document.getElementById('recentRecords');
            if (!container) return;
            const totalItems = medErrorData.length;
            const totalPages = Math.ceil(totalItems / RECENT_ITEMS_PER_PAGE) || 1;
            if (recentRecordsPage >= totalPages) recentRecordsPage = Math.max(0, totalPages - 1);
            
            const start = recentRecordsPage * RECENT_ITEMS_PER_PAGE;
            const pageItems = medErrorData.slice(start, start + RECENT_ITEMS_PER_PAGE);
            
            const pageIndicator = document.getElementById('recentPageIndicator');
            if(pageIndicator) pageIndicator.textContent = totalItems > 0 ? `หน้า ${recentRecordsPage + 1} / ${totalPages}` : 'ไม่มีข้อมูล';
            
            const prevBtn = document.getElementById('prevRecentBtn');
            const nextBtn = document.getElementById('nextRecentBtn');
            if(prevBtn) prevBtn.disabled = recentRecordsPage === 0;
            if(nextBtn) nextBtn.disabled = recentRecordsPage >= totalPages - 1;

            if (pageItems.length === 0) { 
                container.innerHTML = '<p class="text-gray-500 text-center py-4">ยังไม่มีข้อมูล</p>'; 
                return; 
            }
            container.innerHTML = pageItems.map(record => `
                <div class="flex justify-between items-center p-3 bg-gray-50 rounded-lg">
                    <div>
                        <span class="font-medium text-gray-800">HN: ${record.hn}</span>
                        <p class="text-sm text-blue-600">${record.errorType}</p>
                        <p class="text-xs text-gray-500">${record.clinic || ''}</p>
                    </div>
                    <div class="flex items-center space-x-2">
                        <div class="text-sm text-gray-600 text-right">${record.date}<br>${record.time}</div>
                        <button onclick="editRecord(${record.id})" class="p-2 bg-yellow-100 text-yellow-700 hover:bg-yellow-200 rounded-lg"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg></button>
                        <button onclick="deleteRecord(${record.id})" class="p-2 bg-red-100 text-red-700 hover:bg-red-200 rounded-lg"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg></button>
                    </div>
                </div>`).join('');
        }

        // --- Report Page Logic ---
        function loadReportData() { dataTablePage = 0; filterData(); }

        function clearFilters() {
            document.getElementById('startDate').value = '';
            document.getElementById('endDate').value = '';
            document.getElementById('errorTypeFilter').value = 'all';
            document.getElementById('clinicFilter').value = 'all';
            filterData();
        }

        function filterData() {
            const startDate = document.getElementById('startDate').value;
            const endDate = document.getElementById('endDate').value;
            const errorType = document.getElementById('errorTypeFilter').value;
            const clinic = document.getElementById('clinicFilter').value;
            let filtered = medErrorData;
            
            // Date filtering logic
            if (startDate) {
                const start = new Date(startDate).setHours(0,0,0,0);
                filtered = filtered.filter(r => new Date(r.timestamp) >= start);
            }
            if (endDate) {
                const end = new Date(endDate).setHours(23,59,59,999);
                filtered = filtered.filter(r => new Date(r.timestamp) <= end);
            }

            if (errorType !== 'all') filtered = filtered.filter(r => r.errorType === errorType);
            if (clinic !== 'all') filtered = filtered.filter(r => r.clinic === clinic);

            currentFilteredData = filtered;
            dataTablePage = 0;
            updateSummaryCards(currentFilteredData); 
            updateChart(currentFilteredData); 
            updatePieChart(currentFilteredData);
            updateClinicChart(currentFilteredData);
            updateTimeSlotChart(currentFilteredData);
            updateDataTable();
        }

        function prevDataPage() { if (dataTablePage > 0) { dataTablePage--; updateDataTable(); } }
        function nextDataPage() { const totalPages = Math.ceil(currentFilteredData.length / DATA_TABLE_ITEMS_PER_PAGE); if (dataTablePage < totalPages - 1) { dataTablePage++; updateDataTable(); } }
        
        function updateSummaryCards(data) { 
            const totalErrors = document.getElementById('totalErrors');
            if(totalErrors) totalErrors.textContent = data.length;
            
            const today = formatDateToThaiString(new Date());
            const todayErrors = document.getElementById('todayErrors');
            if(todayErrors) todayErrors.textContent = data.filter(r => r.date === today).length;
            
            const days = new Set(data.map(r => r.date)).size; 
            const avgDaily = document.getElementById('avgDaily');
            if(avgDaily) avgDaily.textContent = days > 0 ? (data.length / days).toFixed(1) : 0; 
        }

        function updateChart(data) {
            const ctx = document.getElementById('errorChart').getContext('2d');
            const dailyData = data.reduce((acc, {date}) => { acc[date] = (acc[date] || 0) + 1; return acc; }, {});
            const sortedDates = Object.keys(dailyData).sort((a, b) => {
                const [dayA, monthA, yearA] = a.split('/');
                const [dayB, monthB, yearB] = b.split('/');
                return new Date(`${yearA - 543}-${monthA}-${dayA}`) - new Date(`${yearB - 543}-${monthB}-${dayB}`);
            });
            if (chart) chart.destroy();
            chart = new Chart(ctx, { 
                type: 'line', 
                data: { 
                    labels: sortedDates, 
                    datasets: [{ 
                        label: 'จำนวน Med Error', 
                        data: sortedDates.map(date => dailyData[date]), 
                        borderColor: 'rgb(59, 130, 246)', 
                        backgroundColor: 'rgba(59, 130, 246, 0.1)', 
                        borderWidth: 3, 
                        fill: true, 
                        tension: 0.4 
                    }] 
                }, 
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    scales: { 
                        y: { 
                            beginAtZero: true, 
                            ticks: { stepSize: 1 } 
                        } 
                    },
                    plugins: {
                        datalabels: {
                            display: true,
                            align: 'top',
                            backgroundColor: 'rgba(255, 255, 255, 0.8)',
                            borderColor: 'rgba(59, 130, 246, 0.5)',
                            borderWidth: 1,
                            borderRadius: 4,
                            color: '#1e3a8a', // Dark blue
                            font: {
                                weight: 'bold',
                                family: "'Sarabun', 'Noto Sans Thai', sans-serif"
                            },
                            formatter: (value) => value > 0 ? value : ''
                        }
                    }
                } 
            });
        }
        
        function updatePieChart(data) {
            const pieCtx = document.getElementById('pieChart')?.getContext('2d');
            if (!pieCtx) return;
            const errorCounts = data.reduce((acc, { errorType }) => { acc[errorType] = (acc[errorType] || 0) + 1; return acc; }, {});
            const labels = Object.keys(errorCounts);
            const counts = Object.values(errorCounts);
            const backgroundColors = ['#4A90E2', '#50E3C2', '#F5A623', '#D0021B', '#BD10E0', '#7ED321'];
            if (pieChart) pieChart.destroy();
            pieChart = new Chart(pieCtx, { 
                type: 'pie', 
                data: { 
                    labels: labels, 
                    datasets: [{ 
                        label: 'จำนวน', 
                        data: counts, 
                        backgroundColor: backgroundColors, 
                        hoverOffset: 4 
                    }] 
                }, 
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false, 
                    plugins: { 
                        legend: { 
                            position: 'bottom', 
                            labels: { 
                                padding: 15, 
                                font: { 
                                    family: "'Sarabun', 'Noto Sans Thai', sans-serif" 
                                } 
                            } 
                        }, 
                        datalabels: { 
                            formatter: (value, ctx) => { 
                                const total = ctx.chart.data.datasets[0].data.reduce((a, b) => a + b, 0); 
                                return total === 0 ? '0%' : ((value / total) * 100).toFixed(1) + '%'; 
                            }, 
                            color: '#fff', 
                            font: { 
                                weight: 'bold', 
                                family: "'Sarabun', 'Noto Sans Thai', sans-serif" 
                            } 
                        },
                        // Add 3D plugin config
                        piechart3d: {
                            enabled: true,
                            angle: 45, // Angle of tilt
                            depth: 25, // Thickness
                            shadow: {
                                enabled: true,
                                color: 'rgba(0,0,0,0.3)',
                                opacity: 0.8,
                                blur: 10
                            }
                        }
                    } 
                } 
            });
        }

        function updateClinicChart(data) {
            const barCtx = document.getElementById('clinicBarChart')?.getContext('2d');
            if (!barCtx) return;

            const clinicCounts = data.reduce((acc, { clinic }) => {
                if (clinic) {
                    acc[clinic] = (acc[clinic] || 0) + 1;
                }
                return acc;
            }, {});

            // *** MODIFIED: Logic for Top 11 + Others ***
            const sortedClinics = Object.entries(clinicCounts).sort(([, a], [, b]) => b - a);
            
            let labels;
            let counts;
            
            if (sortedClinics.length > 11) {
                const top11 = sortedClinics.slice(0, 11);
                const others = sortedClinics.slice(11);
                const othersCount = others.reduce((sum, [, count]) => sum + count, 0);

                labels = top11.map(([clinic]) => clinic);
                counts = top11.map(([, count]) => count);

                if (othersCount > 0) {
                    labels.push('อื่นๆ');
                    counts.push(othersCount);
                }
            } else {
                labels = sortedClinics.map(([clinic]) => clinic);
                counts = sortedClinics.map(([, count]) => count);
            }
            // *** END MODIFICATION ***

            const backgroundColors = ['#8B5CF6', '#EC4899', '#10B981', '#F59E0B', '#3B82F6', '#EF4444', '#6366F1', '#FBBF24', '#22C55E', '#D946EF', '#6B7280', '#14B8A6']; // Added more colors

            if (clinicChart) clinicChart.destroy();

            clinicChart = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'จำนวน Error',
                        data: counts,
                        backgroundColor: backgroundColors,
                        borderWidth: 1
                    }]
                },
                options: {
                    indexAxis: 'y', // Horizontal bar chart
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1 
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        datalabels: {
                            anchor: 'end',
                            align: 'right',
                            color: '#374151',
                            font: {
                                weight: 'bold',
                                family: "'Sarabun', 'Noto Sans Thai', sans-serif"
                            },
                             formatter: (value) => value > 0 ? value : ''
                        }
                    }
                }
            });
        }

        function updateTimeSlotChart(data) {
            const barCtx = document.getElementById('timeSlotChart')?.getContext('2d');
            if (!barCtx) return;

            const timeSlots = {
                '07:00-09:59': 0,
                '10:00-11:59': 0,
                '12:00-13:59': 0,
                '14:00-16:30': 0,
            };

            data.forEach(record => {
                const recordDate = new Date(record.timestamp);
                const hours = recordDate.getHours();
                const minutes = recordDate.getMinutes();
                const time = hours + (minutes / 60); // Convert to decimal e.g., 9:59 -> 9.983

                if (time >= 7.0 && time < 10.0) { // 07:00 to 09:59
                    timeSlots['07:00-09:59']++;
                } else if (time >= 10.0 && time < 12.0) { // 10:00 to 11:59
                    timeSlots['10:00-11:59']++;
                } else if (time >= 12.0 && time < 14.0) { // 12:00 to 13:59
                    timeSlots['12:00-13:59']++;
                } else if (time >= 14.0 && time <= 16.5) { // 14:00 to 16:30
                    timeSlots['14:00-16:30']++;
                }
            });

            const labels = Object.keys(timeSlots);
            const counts = Object.values(timeSlots);
            const backgroundColors = ['#1abc9c', '#3498db', '#9b59b6', '#f1c40f'];

            if (timeSlotChart) timeSlotChart.destroy();

            timeSlotChart = new Chart(barCtx, {
                type: 'bar', // Vertical bar chart
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'จำนวน Error',
                        data: counts,
                        backgroundColor: backgroundColors,
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                stepSize: 1 
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            display: false
                        },
                        // *** MODIFIED: Datalabels inside bar ***
                        datalabels: {
                            anchor: 'center',
                            align: 'center',
                            color: '#ffffff', // White color for contrast
                            font: {
                                weight: 'bold',
                                family: "'Sarabun', 'Noto Sans Thai', sans-serif"
                            },
                             formatter: (value) => value > 0 ? value : ''
                        }
                    }
                }
            });
        }

        function updateDataTable() {
            const tableBody = document.getElementById('dataTable');
            if (!tableBody) return;
            const totalItems = currentFilteredData.length;
            const totalPages = Math.ceil(totalItems / DATA_TABLE_ITEMS_PER_PAGE) || 1;
            if (dataTablePage >= totalPages) dataTablePage = Math.max(0, totalPages - 1);
            
            const start = dataTablePage * DATA_TABLE_ITEMS_PER_PAGE;
            const pageItems = currentFilteredData.slice(start, start + DATA_TABLE_ITEMS_PER_PAGE);
            
            const pageIndicator = document.getElementById('dataPageIndicator');
            if(pageIndicator) pageIndicator.textContent = totalItems > 0 ? `หน้า ${dataTablePage + 1} / ${totalPages}` : 'ไม่มีข้อมูล';
            
            const prevBtn = document.getElementById('prevDataBtn');
            const nextBtn = document.getElementById('nextDataBtn');
            if(prevBtn) prevBtn.disabled = dataTablePage === 0;
            if(nextBtn) nextBtn.disabled = dataTablePage >= totalPages - 1;
            
            if (pageItems.length === 0) { 
                tableBody.innerHTML = `<tr><td colspan="7" class="px-4 py-8 text-center text-gray-500">ไม่มีข้อมูลในช่วงเวลาที่เลือก</td></tr>`; 
                return; 
            }
            tableBody.innerHTML = pageItems.map((r, index) => `
                <tr class="hover:bg-gray-50">
                    <td class="px-4 py-4 text-sm text-gray-900">${start + index + 1}</td>
                    <td class="px-4 py-4 text-sm font-medium text-gray-900">${r.hn}</td>
                    <td class="px-4 py-4 text-sm text-blue-800">${r.errorType}</td>
                    <td class="px-4 py-4 text-sm text-gray-500">${r.clinic || ''}</td>
                    <td class="px-4 py-4 text-sm text-gray-900">${r.date}</td>
                    <td class="px-4 py-4 text-sm text-gray-900">${r.time}</td>
                    <td class="px-4 py-4 text-sm">
                        <div class="flex items-center space-x-2">
                             <button onclick="editRecord(${r.id})" class="p-2 bg-yellow-100 text-yellow-700 hover:bg-yellow-200 rounded-lg"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg></button>
                            <button onclick="deleteRecord(${r.id})" class="p-2 bg-red-100 text-red-700 hover:bg-red-200 rounded-lg"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg></button>
                        </div>
                    </td>
                </tr>`).join('');
        }
        
        // --- API Communication ---
        async function sendToGoogleSheets(action, data) {
            const payload = new URLSearchParams();
            payload.append('action', action);
            payload.append('data', JSON.stringify(data));

            try {
                const response = await fetch(scriptURL, { 
                    method: 'POST', body: payload,
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                });
                const result = await response.json(); 
                if (result.status !== 'success' && result.status !== 'duplicate') { 
                    showNotification(result.message || 'เกิดข้อผิดพลาดกับ Google Sheets', 'error'); 
                    console.error('GS Error:', result.message); 
                }
                return result;
            } catch (error) { 
                showNotification('ไม่สามารถเชื่อมต่อ Google Sheets ได้', 'error'); 
                console.error('Fetch Error:', error); 
                return { status: 'error', message: error.message }; 
            }
        }

        // --- Utility Functions ---
        function exportToExcel() {
            let csvContent = "ลำดับ,HN,ประเภท,คลินิก,วันที่,เวลา\n";
            currentFilteredData.forEach((r, i) => { 
                csvContent += `${i + 1},"${r.hn}","${r.errorType}","${r.clinic || ''}","${r.date}","${r.time}"\n`; 
            });
            const blob = new Blob(["\uFEFF" + csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a'); 
            link.href = URL.createObjectURL(blob); 
            link.download = `med_error_report_${new Date().toISOString().split('T')[0]}.csv`;
            document.body.appendChild(link); 
            link.click(); 
            document.body.removeChild(link);
        }

        function showLoading(isLoading) { 
            const overlay = document.getElementById('loadingOverlay');
            if(overlay) overlay.style.display = isLoading ? 'flex' : 'none'; 
        }

        function showNotification(message, type = 'info') { 
            const Toast = Swal.mixin({ 
                toast: true, position: 'top-end', showConfirmButton: false, 
                timer: 3000, timerProgressBar: true, 
                didOpen: (t) => { t.addEventListener('mouseenter', Swal.stopTimer); t.addEventListener('mouseleave', Swal.resumeTimer); } 
            }); 
            Toast.fire({ icon: type, title: message }); 
        }
    </script>
